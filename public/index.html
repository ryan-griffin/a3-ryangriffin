<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="A simple coursework tracker for WPI assignments."
		/>
		<title>Due Soon | WPI Assignment Tracker</title>
		<link rel="stylesheet" href="css/main.css" />
		<link rel="icon" href="data:;base64,iVBORw0KGgo=" />
		<script src="js/main.js" defer></script>
	</head>
	<body>
		<header>
			<div class="container" id="header-bar"><a href="/">Due Soon</a><span id="header-user"><span id="user-label" hidden></span><button id="logout-button" class="row-button" type="button" hidden>Log out</button></span></div>
		</header>

		<main class="container">
			<section id="login-card" class="card" hidden>
				<h2>Log in</h2>
				<p>New accounts are created automatically on first login.</p>
				<form id="login-form">
					<div id="form-grid">
						<label class="field field--wide">
							<span>Username</span>
							<input
								name="username"
								type="text"
								maxlength="50"
								autocomplete="username"
								required
							/>
						</label>
						<label class="field field--wide">
							<span>Password</span>
							<input
								name="password"
								type="password"
								maxlength="200"
								autocomplete="current-password"
								required
							/>
						</label>
					</div>
					<div id="form-actions">
						<button
							class="button button--primary"
							id="login-button"
							type="submit"
						>
							Log in
						</button>
					</div>
				</form>
				<p id="login-error" hidden></p>
			</section>
			<div id="content-grid" hidden>
				<section class="card">
					<h2>Assignments</h2>
					<p id="results-caption">Loading assignments...</p>
					<div id="assignment-table-wrap">
						<table>
							<thead>
								<tr>
									<th scope="col">Assignment</th>
									<th scope="col">Course</th>
									<th scope="col">Due</th>
									<th scope="col">Days left</th>
									<th scope="col">Hours</th>
									<th scope="col">Priority</th>
									<th scope="col">Urgency</th>
									<th scope="col">Actions</th>
								</tr>
							</thead>
							<tbody id="assignment-rows">
								<tr>
									<td id="table-message" colspan="8">
										Loading assignments...
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</section>

				<section id="assignment-form-card" class="card">
					<h2 id="form-title">Add an assignment</h2>
					<form id="assignment-form">
						<div id="form-grid">
							<label class="field field--wide">
								<span>Assignment name</span>
								<input
									name="title"
									type="text"
									maxlength="100"
									placeholder="e.g. Short Stack"
									required
								/>
							</label>
							<label class="field field--wide">
								<span>Course</span>
								<input
									name="course"
									type="text"
									maxlength="30"
									placeholder="e.g. CS 4241"
									required
								/>
							</label>
							<label class="field">
								<span>Due date</span>
								<input name="dueDate" type="date" required />
							</label>
							<label class="field">
								<span>Estimated hours</span>
								<input
									name="hours"
									type="number"
									min="0.5"
									max="100"
									step="0.5"
									placeholder="4"
									required
								/>
							</label>
							<label class="field field--wide">
								<span>Priority</span>
								<select name="priority" required>
									<option value="" disabled>
										Select priority
									</option>
									<option value="high">High</option>
									<option value="medium" selected>
										Medium
									</option>
									<option value="low">Low</option>
								</select>
							</label>
						</div>
						<div id="form-actions">
							<button
								class="button button--primary"
								id="save-button"
								type="submit"
							>
								Add assignment
							</button>
							<button
								class="button button--muted"
								id="cancel-button"
								type="button"
								hidden
							>
								Cancel edit
							</button>
						</div>
					</form>
				</section>
			</div>
		</main>

		<footer class="container">
			<span>Due Soon</span>
			<span>Assignment data is stored per user in MongoDB.</span>
		</footer>
	</body>
</html>
